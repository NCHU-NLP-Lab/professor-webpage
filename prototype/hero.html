<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yao-Chung Fan — Hero Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  :root {
    --bg:        oklch(0.13 0.005 240);
    --bg-deep:   oklch(0.09 0.005 240);
    --fg:        oklch(0.96 0.01 240);
    --muted:     oklch(0.55 0.01 240);
    --border:    oklch(0.22 0.005 240);
    --accent:    oklch(0.78 0.16 175);
    --accent-rgb: 86 220 200;

    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --font-sans: 'Inter', 'Noto Sans TC', -apple-system, system-ui, sans-serif;
  }

  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, oklch(0.20 0.04 175 / 0.25), transparent 60%),
      radial-gradient(900px 600px at 0% 100%, oklch(0.18 0.05 260 / 0.20), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .hero {
    position: relative;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(1.25rem, 4vw, 3rem);
    overflow: hidden;
  }

  #bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.55;
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    max-width: 720px;
    width: 100%;
  }

  .meta {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--muted);
    margin: 0 0 2rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .meta::before { content: '› '; color: var(--accent); }

  h1 {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: clamp(2.2rem, 5.5vw, 3.6rem);
    margin: 0 0 0.4rem;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  .titles {
    font-family: var(--font-mono);
    font-size: clamp(0.875rem, 1.4vw, 1rem);
    color: var(--muted);
    margin: 0 0 1.6rem;
    letter-spacing: 0.01em;
  }
  .titles .accent { color: var(--accent); }

  .bio {
    font-family: var(--font-sans);
    font-size: clamp(1rem, 1.4vw, 1.125rem);
    line-height: 1.65;
    margin: 0 0 2.2rem;
    max-width: 36em;
    color: oklch(0.88 0.01 240);
  }

  .caret::after {
    content: '▍';
    color: var(--accent);
    margin-left: 1px;
    animation: blink 1.05s steps(1, end) infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  .chat {
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: oklch(0.14 0.005 240 / 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: border-color 200ms ease, box-shadow 200ms ease;
  }
  .chat:focus-within {
    border-color: rgb(var(--accent-rgb) / 0.6);
    box-shadow: 0 0 0 1px rgb(var(--accent-rgb) / 0.4),
                0 0 40px -8px rgb(var(--accent-rgb) / 0.5);
  }
  .chat-prefix {
    font-family: var(--font-mono);
    color: var(--accent);
    padding: 0 0.4rem 0 1.05rem;
    user-select: none;
    font-size: 1rem;
  }
  .chat input {
    flex: 1;
    background: transparent;
    border: 0;
    padding: 0.95rem 0;
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 0.95rem;
    outline: 0;
    min-width: 0;
  }
  .chat input::placeholder { color: var(--muted); }
  .chat button {
    background: transparent;
    border: 0;
    color: var(--muted);
    font-family: var(--font-mono);
    padding: 0 1.1rem;
    cursor: pointer;
    transition: color 150ms ease, transform 150ms ease;
    font-size: 0.95rem;
  }
  .chat button:hover { color: var(--accent); transform: translateX(2px); }

  .chat-shell-note {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--muted);
    margin: 0.6rem 0 0;
    opacity: 0.6;
    letter-spacing: 0.02em;
  }

  .chat-output {
    margin-top: 1.2rem;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: oklch(0.78 0.01 240);
    line-height: 1.7;
    padding: 0.9rem 1rem;
    border-left: 1px solid rgb(var(--accent-rgb) / 0.4);
    background: oklch(0.14 0.005 240 / 0.3);
    border-radius: 0 6px 6px 0;
  }
  .chat-output .q { color: var(--fg); display: block; margin-bottom: 0.5rem; }
  .chat-output .q::before { content: '› '; color: var(--accent); }
  .chat-output .a::before {
    content: '◂ eduxplore: ';
    color: var(--accent);
    font-size: 0.72rem;
    letter-spacing: 0.05em;
  }

  .scroll-cue {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    opacity: 0.6;
    z-index: 1;
  }
  .scroll-cue::after {
    content: ' ↓';
    display: inline-block;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50%      { transform: translateY(4px); opacity: 1; }
  }
</style>
</head>
<body>
<header class="hero">
  <canvas id="bg" aria-hidden="true"></canvas>

  <div class="hero-content">
    <p class="meta" data-stream>nchu.cs / nlp lab / 2026</p>
    <h1 data-stream>Yao-Chung Fan</h1>
    <p class="titles" data-stream data-html='中興大學資工系 教授 · <span class="accent">副教務長</span> · NLP Lab 主持人'>
      中興大學資工系 教授 · 副教務長 · NLP Lab 主持人
    </p>
    <p class="bio" data-stream>打造能讀、能推理、能落地的 agentic AI 系統 — 從全校 AI 學伴到跨機構部署，再到低資源語言對話。</p>

    <form class="chat" autocomplete="off" id="chat">
      <span class="chat-prefix" aria-hidden="true">›</span>
      <input id="chat-input" placeholder="問我關於范老師的研究、課程、論文…" aria-label="Ask Professor Fan">
      <button type="submit" aria-label="送出">↵</button>
    </form>
    <p class="chat-shell-note">UI shell · eduxplore backend coming soon</p>
    <div class="chat-output" id="chat-output" hidden></div>
  </div>

  <div class="scroll-cue" aria-hidden="true">scroll</div>
</header>

<script type="module">
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function streamText(el, text, opts = {}) {
    const { minDelay = 14, maxDelay = 42, startDelay = 0 } = opts;
    return new Promise(resolve => {
      el.textContent = '';
      el.classList.add('caret');
      if (reduce) {
        el.textContent = text;
        el.classList.remove('caret');
        resolve();
        return;
      }
      let i = 0;
      const tick = () => {
        if (i >= text.length) {
          el.classList.remove('caret');
          resolve();
          return;
        }
        el.textContent += text[i++];
        setTimeout(tick, Math.random() * (maxDelay - minDelay) + minDelay);
      };
      setTimeout(tick, startDelay);
    });
  }

  async function bootStream() {
    const els = [...document.querySelectorAll('[data-stream]')];
    const items = els.map(el => ({
      el,
      html: el.dataset.html ?? el.innerHTML,
      text: el.textContent.trim(),
    }));
    items.forEach(({ el }) => { el.textContent = ''; });

    let delay = 250;
    for (const item of items) {
      await streamText(item.el, item.text, { startDelay: delay });
      if (item.html !== item.text) item.el.innerHTML = item.html;
      delay = 60;
    }
  }

  function bootBackground() {
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let w, h, dpr, points;
    const N = 80;
    const LINK = 140;
    const ACCENT = '86 220 200';

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.clientWidth;
      h = canvas.clientHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function init() {
      resize();
      points = Array.from({ length: N }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.18,
        vy: (Math.random() - 0.5) * 0.18,
      }));
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < points.length; i++) {
        for (let j = i + 1; j < points.length; j++) {
          const a = points[i], b = points[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < LINK * LINK) {
            const d = Math.sqrt(d2);
            const alpha = (1 - d / LINK) * 0.18;
            ctx.strokeStyle = `rgb(${ACCENT} / ${alpha})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
      for (const p of points) {
        ctx.fillStyle = `rgb(${ACCENT} / 0.65)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.3, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.vx; p.y += p.vy;
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10;
        if (p.y > h + 10) p.y = -10;
      }
      if (!reduce) requestAnimationFrame(draw);
    }
    init();
    window.addEventListener('resize', init);
    if (reduce) draw(); else requestAnimationFrame(draw);
  }

  function bootChat() {
    const form = document.getElementById('chat');
    const input = document.getElementById('chat-input');
    const out = document.getElementById('chat-output');

    const cannedReplies = [
      'UI shell here — eduxplore 後端尚未串接。實際的興學伴系統可在 eduxplore.nlpnchu.org 體驗。',
      '這是 UI 原型，目前僅供視覺氣質確認。後續會接上 AI 興學伴 API（或退回 iframe / canned）。',
    ];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      out.hidden = false;
      out.innerHTML = `<span class="q">${escapeHtml(q)}</span><span class="a" id="answer"></span>`;
      const ans = document.getElementById('answer');
      const reply = cannedReplies[Math.floor(Math.random() * cannedReplies.length)];
      await new Promise(r => setTimeout(r, 280));
      await streamText(ans, reply, { minDelay: 10, maxDelay: 32 });
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  bootBackground();
  bootStream();
  bootChat();
</script>
</body>
</html>
